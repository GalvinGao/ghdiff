name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run nobody had to push for. GitHub Actions lost this repository's queue
  # for three hours on 2026-08-26 and stranded the run for a merge to main;
  # with only the two triggers above, the sole way to ask for another was to
  # push again. This is the ask. It runs the two jobs below and not the deploy,
  # which stays gated on a push to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is waste. A superseded push to main holds the
  # deploy job, and killing a deploy halfway is worse than letting it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: oxlint
        run: pnpm lint

      - name: oxfmt check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Builds the client bundle and the Worker. The build must not need a
      # GitHub token: the browser holds it and sends it per request.
      - name: Build
        run: pnpm build

      # `vite build` regenerates the route tree. If the build changed it, the
      # committed copy was stale.
      - name: Route tree is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/routeTree.gen.ts)" ]; then
            echo 'src/routeTree.gen.ts is stale. Run `pnpm build` and commit it.'
            git --no-pager diff -- src/routeTree.gen.ts
            exit 1
          fi

      # Packages the Worker exactly as a deploy would, and fails on anything
      # workerd cannot run. Needs no Cloudflare credentials.
      - name: Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run

  # Only after both jobs above are green, and only for a push to main. A pull
  # request gets the dry run and nothing else.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Its own group, so two pushes in a row queue instead of racing for the same
    # Worker.
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # `wrangler deploy` builds nothing. The Vite build writes
      # `.wrangler/deploy/config.json`, which redirects wrangler to the
      # generated `dist/server/wrangler.json`, and wrangler errors without it.
      - name: Build
        run: pnpm build

      # The account is named in wrangler.jsonc, so the token is the only secret
      # this job needs.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
